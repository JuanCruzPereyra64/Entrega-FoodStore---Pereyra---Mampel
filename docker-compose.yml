version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: foodstore_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: food_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: foodstore_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/food_store
      - CORS_ORIGINS=["http://localhost:5173", "http://127.0.0.1:5173"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: foodstore_frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
